name: Seraphim Scraper

permissions:
  contents: read

on:
  # Scheduling is owned by the organization-level dispatcher, which invokes
  # this workflow through the GitHub API every 15 minutes.
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions UI

jobs:
  scrape:
    name: Ingest OSINT Events
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: seraphim-ingestion
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

      - name: Cache HuggingFace model weights
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.cache
          key: ${{ runner.os }}-hf-${{ hashFiles('src/lib/utils/vectorize.ts') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          IMAGE_PAGE_ENRICHMENT_ENABLED: ${{ vars.IMAGE_PAGE_ENRICHMENT_ENABLED || 'false' }}
        run: bun run src/scraper/index.ts
