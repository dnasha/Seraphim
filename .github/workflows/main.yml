name: Seraphim Scraper

on:
  #schedule:
    # Run every 30 minutes
    #- cron: '*/30 * * * *'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions UI

jobs:
  scrape:
    name: Ingest OSINT Events
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache HuggingFace model weights
        uses: actions/cache@v5
        with:
          path: ./.cache
          key: ${{ runner.os }}-hf-${{ hashFiles('src/scraper/utils/vectorize.ts') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: bun run src/scraper/index.ts
