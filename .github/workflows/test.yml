name: Seraphim Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

      - name: Cache HuggingFace model weights
        uses: actions/cache@v5
        with:
          path: ./.cache
          key: ${{ runner.os }}-hf-${{ hashFiles('src/scraper/utils/vectorize.ts') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests and coverage gate
        run: bun run test:coverage
