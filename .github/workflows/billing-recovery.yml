name: Billing recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: seraphim-billing-recovery
  cancel-in-progress: false

jobs:
  recover:
    # Enable only after the private migration and matching web release are deployed.
    if: vars.BILLING_RECOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Recover pending billing and deletion jobs
        run: bun --conditions=react-server scripts/maintenance/recover-billing.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_YEARLY: ${{ vars.STRIPE_PRICE_PRO_YEARLY }}
          STRIPE_PRICE_ANALYST_MONTHLY: ${{ vars.STRIPE_PRICE_ANALYST_MONTHLY }}
          STRIPE_PRICE_ANALYST_YEARLY: ${{ vars.STRIPE_PRICE_ANALYST_YEARLY }}
          STRIPE_PRICE_ANGEL: ${{ vars.STRIPE_PRICE_ANGEL }}
